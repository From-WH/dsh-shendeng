<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="神灯 Lamp">
  <defs>
    <radialGradient id="vellum" cx="0.5" cy="0.42" r="0.68">
      <stop offset="0" stop-color="#2a1c44"/>
      <stop offset="0.55" stop-color="#150f24"/>
      <stop offset="1" stop-color="#08060f"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9ee0" stop-opacity="0.68"/>
      <stop offset="0.4" stop-color="#b98cff" stop-opacity="0.32"/>
      <stop offset="0.72" stop-color="#6fa8ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6fa8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffd6f2"/>
      <stop offset="0.34" stop-color="#d18ce8"/>
      <stop offset="0.68" stop-color="#8b5ed6"/>
      <stop offset="1" stop-color="#4a3a86"/>
    </linearGradient>
    <linearGradient id="brassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4ff"/>
      <stop offset="1" stop-color="#a97ee8"/>
    </linearGradient>
    <linearGradient id="flameG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7fd4ff"/>
      <stop offset="0.36" stop-color="#b98cff"/>
      <stop offset="0.7" stop-color="#ff9ee0"/>
      <stop offset="1" stop-color="#fff6ff"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ff0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8a6bff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- dark vellum plate -->
  <rect width="64" height="64" rx="14" fill="url(#vellum)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#b48ce8" stroke-opacity="0.3"/>

  <!-- mandala corner brackets -->
  <g fill="none">
    <path d="M11 20.5v-6.5c0-1.66 1.34-3 3-3h6.5" stroke="#c79bf0" stroke-opacity="0.58" stroke-width="1.1"/>
    <path d="M53 43.5v6.5c0 1.66-1.34 3-3 3h-6.5" stroke="#c79bf0" stroke-opacity="0.58" stroke-width="1.1"/>
  </g>

  <!-- orbiting sparks (sci-fi motion trails) -->
  <g fill="none" stroke="url(#teal)" stroke-linecap="round" opacity="0.7">
    <path d="M32 8.5c11.2 0 20.6 7.6 22.6 17.8" stroke-width="0.9" stroke-dasharray="2 7.5"/>
    <path d="M32 55.5C20.8 55.5 11.4 47.9 9.4 37.7" stroke-width="0.9" stroke-dasharray="1 8.5"/>
  </g>

  <!-- aura behind the flame -->
  <circle cx="17.5" cy="15.5" r="15.5" fill="url(#aura)"/>

  <!-- body -->
  <path d="M15.5 45.6h34.2c0 3.1-2.6 5.6-5.8 5.6H21.3c-3.2 0-5.8-2.5-5.8-5.6z" fill="url(#brass)"/>
  <path d="M17.6 44.4c-2.3-7.4-.6-14.8 4.5-19 4-3.3 9.3-4.5 14.3-4 4.6.4 8.3 2.3 10.6 5.3 2.9 3.7 3.6 8.8 1.9 13.7-.6 2-1.6 3.6-2.9 5-2.3 2.6-5.6 4-9.3 4H23.4c-2.9 0-5.5-1.7-5.8-5z" fill="url(#brass)"/>
  <path d="M22.6 26.2c3.8-2.7 8.7-3.6 13.3-3 2.1.3 3.9.9 5.4 1.8-5-1.2-10.4-.7-14.9 1.6-2.4 1.3-4.4 3.1-5.7 5.3.2-2.1 1-4.1 1.9-5.7z" fill="url(#brassEdge)" opacity="0.42"/>

  <!-- mandala filigree on the belly -->
  <g fill="none" stroke="#fff0cf" stroke-opacity="0.72">
    <circle cx="32" cy="32.6" r="7.4" stroke-width="0.8"/>
    <circle cx="32" cy="32.6" r="4.3" stroke-width="0.6" stroke-dasharray="1.6 2.4"/>
    <path d="M32 25.2v14.8M24.6 32.6h14.8M27 27.6l10 10M37 27.6l-10 10" stroke-width="0.55" stroke-opacity="0.5"/>
    <path d="M32 22.9l1.5 2.6-1.5 2.6-1.5-2.6zM32 39.1l1.5 2.6-1.5 2.6-1.5-2.6z" stroke-width="0.6" stroke-opacity="0.6"/>
  </g>

  <!-- spout -->
  <path d="M18.6 36.4c-7.3-4.9-13-11.7-15.8-19.4 10.1-1.8 19.9 1.3 27.2 8z" fill="url(#brass)"/>
  <path d="M2.9 17.2c3.7-.8 7.5-.8 11.1 0-1.2 1.8-3.2 2.9-5.5 2.9-2.4 0-4.4-1.1-5.6-2.9z" fill="url(#brassEdge)"/>

  <!-- lid -->
  <path d="M36.3 20.4c0-3.4 2.8-6.2 6.2-6.2s6.2 2.8 6.2 6.2z" fill="url(#brassEdge)"/>
  <ellipse cx="42.5" cy="20.6" rx="6.5" ry="1.4" fill="#3d2f6e" opacity="0.55"/>

  <!-- ring handle -->
  <path d="M49.4 25.4c5.8-.6 10.5 3.1 11.4 8.5.9 5.5-2.6 10.8-8.1 12" fill="none" stroke="url(#brass)" stroke-width="4" stroke-linecap="round"/>

  <!-- flame at the spout lip -->
  <path d="M6.6 4.9c3 3.7 4.6 6.4 4.6 8.5 0 2.54-2.06 4.6-4.6 4.6S2 15.94 2 13.4c0-2.1 1.6-4.8 4.6-8.5z" fill="url(#flameG)"/>
  <path d="M6.6 9.7c1.3 1.7 2 2.9 2 3.9 0 1.1-.9 2-2 2s-2-.9-2-2c0-1 .7-2.2 2-3.9z" fill="#fffdf4" opacity="0.9"/>
</svg>
